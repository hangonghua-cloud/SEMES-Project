<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'Siemens.SimaticIT.MaterialApp.ProductDatafile.ProductDatafileedit.Tips_1'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button" ng-show="vm.validInputs">{{'Siemens.SimaticIT.MaterialApp.ProductDatafile.ProductDatafileedit.Tips_2'|translate}}</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="edit_form"
                       sit-layout="Vertical"
                       sit-type="Fluid"
                       sit-mode="edit"
                       sit-columns="1">
        <!-- TODO: Put here the properties of the entity managed by the service -->
        <sit-property sit-widget="sit-text" sit-value="vm.currentItem.MaterialName" sit-validation="{required: false}"
                      sit-read-only="true">{{'Siemens.SimaticIT.MaterialApp.ProductDatafile.ProductDatafileedit.Tips_3'|translate}}</sit-property>
        <sit-property sit-widget="sit-alp-text-picker" sit-value="vm.currentItem.TableEntity"
                      sit-validation="{required: true}" sit-read-only="true" ng-click="vm.selectClick()">
