            <div class="col-xs-8 col-md-15" id="boxTree" style="height: 100%;overflow: hidden;">
                <div style="margin: 16px 0px 15px 10px; border: 1px solid #cccccc;
                background-color: #f6f6f6; width:calc(100%-10px); height: 98%; padding:1px 10px 0 10px;overflow-y: auto;">

                    <js-tree tree-types="typesConfig" tree-data="scope" tree-model="treeModel" tree-core="treeCore"

                </div>

            </div>

                    <div class="panel-Title">
                        <div style="margin-left: 10px;">
                            {{'Siemens.SimaticIT.FactoryModelApp.ModelManage.ModelManagelist.Tips_1'|translate}}
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
