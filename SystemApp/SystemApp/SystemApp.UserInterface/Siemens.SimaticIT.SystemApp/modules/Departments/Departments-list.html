<!--部门管理-->
<div id="itemlist" class="content-area content-area-relative" style="height: calc(90% - 30px) !important">
    <div class="col-md-40 serachPanel" style="margin-left: 10px;">
        <div class="side-panel-property-area-body">
            <sit-property-grid sit-id="add_form" sit-layout="Horizontal" sit-type="Fluid" sit-mode="edit"
                               sit-columns="6">
                <sit-property sit-widget="sit-select" sit-value="vm.typeFactory.value"
                              sit-options="vm.typeFactory.options" sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'">
                    {{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_1'|translate}}
                </sit-property>
                <sit-property sit-widget="sit-text" sit-value="vm.searchParams.Code" sit-read-only="false">
                    {{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_2'|translate}}
                </sit-property>
                <sit-property sit-widget="sit-text" sit-value="vm.searchParams.Name" sit-read-only="false">
                    {{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_3'|translate}}
                </sit-property>
                <sit-command-bar sit-type="action">
                    <sit-command sit-icon="fa-search" sit-type="main" sit-name="com.siemens.customcommand.search"
                                 :sit-tooltip="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_4'|translate}}" ng-click="vm.searchButtonHandler" :sit-label="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_4'|translate}}">
                    </sit-command>
                </sit-command-bar>
            </sit-property-grid>
        </div>
        <sit-command-bar sit-vertical-autofixed="true" sit-type="Tool" :sit-label-align="right" sit-layout="vertical">

            <!-- <sit-command sit-icon="fa fa-refresh" sit-type="main" sit-name="com.siemens.customcommand.search" :sit-tooltip="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_5'|translate}}" ng-click="vm.doneButtonHandler"
                :sit-label="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_5'|translate}}"></sit-command> -->
            <sit-command sit-icon="fa-trash " sit-type="main" sit-name="com.siemens.customcommand.search"
                         :sit-tooltip="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_6'|translate}}" ng-click="vm.deleteButtonHandler" ng-show="vm.isButtonVisible" :sit-label="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_6'|translate}}">
            </sit-command>
            <sit-command sit-icon="fa-pencil-square-o " sit-type="main" sit-name="com.siemens.customcommand.search"
                         :sit-tooltip="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_7'|translate}}" ng-click="vm.editButtonHandler" ng-show="vm.isButtonVisible" :sit-label="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_7'|translate}}">
            </sit-command>
            <sit-command sit-icon="fa-plus " sit-type="main" sit-name="com.siemens.customcommand.search"
                         :sit-tooltip="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_8'|translate}}" ng-click="vm.addButtonHandler" ng-show="vm.is_addValueButtonHandler" :sit-label="{{'Siemens.SimaticIT.SystemApp.Departments.Departmentslist.Tips_8'|translate}}">
            </sit-command>

        </sit-command-bar>
    </div>
    <div id="listClass" style="width:100%; height: 100%; padding:0px 16px 0 16px; margin-top: 3px;">
        <div ui-grid="vm.gridOptions" ui-grid-pinning ui-grid-auto-resize ui-grid-resize-columns ui-grid-selection
             ui-grid-pagination class="uigrid"></div>
    </div>
</div>
