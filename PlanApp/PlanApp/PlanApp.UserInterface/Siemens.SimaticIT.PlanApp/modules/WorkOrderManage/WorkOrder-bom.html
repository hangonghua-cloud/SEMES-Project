<div class="command-bar-side-panel">

    <button ng-click="vm.save()"

    <button ng-click="vm.deleteItemButtonHandler()" class="btn side-panel-button"

    <button ng-click="vm.selectItemButtonHandler()"
            class="btn side-panel-button">
        {{'Siemens.SimaticIT.PlanApp.WorkOrderManage.bom.Tips_6'|translate}}
    </button>

</div>
