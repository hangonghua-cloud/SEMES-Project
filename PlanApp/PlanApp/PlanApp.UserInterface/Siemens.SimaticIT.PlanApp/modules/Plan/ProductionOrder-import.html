<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'Siemens.SimaticIT.PlanApp.Plan.import.Tips_1'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button" ng-show="vm.validInputs">{{'Siemens.SimaticIT.PlanApp.Plan.import.Tips_2'|translate}}</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form"
                       sit-layout="Vertical"
                       sit-type="Fluid"
                       sit-mode="edit"
                       sit-columns="1">
        <!-- TODO: Put here the properties of the entity managed by the service -->
        <!-- <sit-property sit-widget="sit-text"
                      sit-value="vm.currentItem.Id"
                      sit-validation="{required: true}"
                      sit-read-only="false">ID:</sit-property> -->
        <sit-property sit-id="File" sit-widget="sit-file-uploader"
                      sit-value="vm.file"
                      sit-validation="{ required: true }"
                      sit-change="vm.changeFile"
                      sit-widget-attributes="{'accept':'.xls,.xlsx','sit-min-size': '1KB', 'sit-max-size': '10MB'}">
            （<a href="">{{'Siemens.SimaticIT.PlanApp.Plan.import.Tips_3'|translate}}</a>）:
        </sit-property>
    </sit-property-grid>
    <div>
        <sit-tabset>
            <sit-tab heading="{{'Siemens.SimaticIT.PlanApp.Plan.import.Tips_4'|translate}}"><div id="sittab1" style="overflow: hidden;overflow-x:auto;white-space: nowrap;height: 300px;"></div></sit-tab>
            <sit-tab heading="{{'Siemens.SimaticIT.PlanApp.Plan.import.Tips_5'|translate}}"><div id=sittab2 style="overflow: hidden;overflow-x:auto;white-space: nowrap;height: 300px;"></div></sit-tab>
        </sit-tabset>
    </div>
    <div>
        <span id="warning"></span>
    </div>


</div>
