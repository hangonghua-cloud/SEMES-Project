<style>
    .row {
        padding: 5px;
        margin-top: 10px;
    }
</style>
<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">取消</button>
    <button ng-click="vm.save()" class="btn side-panel-button">保存</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form"
                       sit-layout="Vertical"
                       sit-type="Fluid"
                       sit-mode="edit"
                       sit-columns="1">
        <sit-property-grid sit-id="view_form" sit-layout="Horizontal" sit-type="Fixed" sit-mode="edit" sit-columns="2" style="margin-left: 4px;">

            <sit-property sit-widget="sit-select" sit-value="vm.Factory.value" sit-validation="{required: false}" sit-options="vm.Factory.options"
                          sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="vm.IsReadOnly" sit-change="vm.FactoryChange">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.Factory'|translate}}</sit-property>
            <sit-property sit-widget="sit-select" sit-value="vm.Process.value" sit-validation="{required: false}" sit-options="vm.Process.options"
                          sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="true">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.Process'|translate}}</sit-property>
            <sit-property sit-widget="sit-text" sit-value="vm.currentItem.PTeamCode" sit-validation="{required: true}"
                          sit-read-only="true">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.PTeamCode'|translate}}</sit-property>
            <sit-property sit-widget="sit-text" sit-value="vm.currentItem.PTeamName" sit-validation="{required: true}"
                          sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.PTeamName'|translate}}</sit-property>
            <!-- <sit-property sit-widget="sit-text" sit-value="vm.currentItem.PTeamPersons" sit-validation="{required: true}"
                          sit-read-only="true">生产小组人员:</sit-property> -->

        </sit-property-grid>
    </sit-property-grid>
</div>
