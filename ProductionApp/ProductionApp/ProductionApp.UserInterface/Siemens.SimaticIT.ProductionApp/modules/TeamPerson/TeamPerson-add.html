<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'customCommon.Button.Cancel'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button">{{'customCommon.Button.Save'|translate}}</button>

                      sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="false" sit-change="vm.typeFactoryChange">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.Factory'|translate}}</sit-property>
        <sit-property sit-widget="sit-select" sit-value="vm.typeProcess.value" sit-validation="{required: true}" sit-options="vm.typeProcess.options"
                      sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.Process'|translate}}</sit-property>
        <sit-property sit-widget="sit-text" sit-value="vm.currentItem.PTeamCode" sit-validation="{required: true}"
                      sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.PTeamCode'|translate}}</sit-property>
        <sit-property sit-widget="sit-text" sit-value="vm.currentItem.PTeamName" sit-validation="{required: true}"
                      sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TeamPerson.PTeamName'|translate}}</sit-property>

    </sit-property-grid>
