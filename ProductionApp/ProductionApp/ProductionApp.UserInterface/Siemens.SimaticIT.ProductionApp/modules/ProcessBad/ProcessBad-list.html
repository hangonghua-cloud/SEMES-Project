<style>
    .MainCommandActionButton {
        margin-top: 20px !important;
    }
</style>
<div id="itemlist" class="content-area content-area-relative" style="height: calc(93% - 30px) !important">
    <!--查询条件与功能按钮-->
    <div class="col-md-40" style="margin-left: 15px;height: calc(14% - 10px)">
        <div class="side-panel-property-area-body">
            <sit-property-grid sit-id="add_form" sit-layout="Horizontal" sit-type="Fixed" sit-mode="edit" sit-columns="6">
                <sit-property sit-widget="sit-select" sit-value="vm.Factory.value" sit-validation="{required: false}" sit-options="vm.Factory.options"
                              sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="false" sit-change="vm.FactoryChange">{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_1'|translate}}</sit-property>
                <sit-property sit-widget="sit-select" sit-value="vm.Process.value" sit-validation="{required: false}" sit-options="vm.Process.options"
                              sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'" sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_2'|translate}}</sit-property>
                <sit-command-bar sit-type="action">
                    <sit-command sit-icon="fa-search" sit-type="main" sit-name="com.siemens.customcommand.search" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_3'|translate}}" ng-click="vm.searchButtonHandler" :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_3'|translate}}">
                    </sit-command>
                </sit-command-bar>
            </sit-property-grid>
        </div>
    </div>
    <!--右侧功能按钮-->
    <sit-command-bar sit-vertical-autofixed="true" sit-type="Tool" :sit-label-align="right" sit-layout="vertical">
        <sit-command sit-icon="fa-trash-o" sit-name="com.siemens.customcommand.delete" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_4'|translate}}" ng-click="vm.delete2ButtonHandler"
                     :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_4'|translate}}" ng-show="vm.isDetailButtonVisible" sit-type="main"></sit-command>
        <sit-command sit-icon="fa-plus-square-o" sit-name="com.siemens.customcommand.add" ng-click="vm.add2ButtonHandler" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_5'|translate}}"
                     :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_5'|translate}}" ng-show="vm.isButtonVisible" sit-type="main"></sit-command>


        <sit-command sit-icon="fa-trash" sit-name="com.siemens.customcommand.delete" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_4'|translate}}" ng-click="vm.deleteButtonHandler"
                     :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_4'|translate}}" ng-show="vm.isButtonVisible"></sit-command>
        <!-- <sit-command sit-icon="fa-pencil" sit-name="com.siemens.customcommand.edit" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_6'|translate}}" ng-click="vm.editButtonHandler"
                     :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_6'|translate}}" ng-show="vm.isButtonVisible"></sit-command> -->
        <sit-command sit-icon="fa-plus" sit-name="com.siemens.customcommand.add" ng-click="vm.addButtonHandler" :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_5'|translate}}"
                     :sit-label="{{'Siemens.SimaticIT.ProductionApp.ProcessBad.Tips_5'|translate}}" sit-type="main"></sit-command>
    </sit-command-bar>
    <!-- grid列表 -->
    <div id="listClass" style="width:100%; height: 48%; padding:0px 16px 0 16px; margin-top: 3px;">
        <div ui-grid="vm.gridOptions" ui-grid-pinning ui-grid-auto-resize ui-grid-resize-columns ui-grid-selection ui-grid-pagination class="uigrid"></div>
    </div>
    <!--子明细管理-->
    <!-- grid列表 -->
    <div id="listClass2" class="col-md-40" style="width:100%; height: 48%; padding:0px 16px 0 16px; margin-top: 3px;">
        <div ui-grid="vm.gridOptionsDetail" ui-grid-pinning ui-grid-auto-resize ui-grid-resize-columns ui-grid-selection ui-grid-pagination class="uigrid"></div>
    </div>
</div>
