<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'Siemens.SimaticIT.ProductionApp.TransferList.addBad.Tips_1'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button" ng-show="vm.validInputs">{{'Siemens.SimaticIT.ProductionApp.TransferList.addBad.Tips_2'|translate}}</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form"
                       sit-layout="Vertical"
                       sit-type="Fluid"
                       sit-mode="edit"
                       sit-columns="1">
        <sit-property sit-widget="sit-select" sit-value="vm.BadItem.value" sit-validation="{required: false}" sit-options="vm.BadItem.options"
                      sit-to-display="'BadItemName'" sit-to-keep="'BadItemCode'" sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TransferList.addBad.Tips_3'|translate}}</sit-property>

        <sit-property sit-widget="sit-numeric" sit-value="vm.currentItem.BadQty" sit-validation="{required: true, min: 0}"
                      sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.TransferList.addBad.Tips_4'|translate}}</sit-property>
    </sit-property-grid>
</div>
