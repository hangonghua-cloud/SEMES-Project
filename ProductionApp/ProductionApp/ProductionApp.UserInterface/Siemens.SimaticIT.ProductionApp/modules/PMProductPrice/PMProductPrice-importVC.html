<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'Siemens.SimaticIT.ProductionApp.PMProductPrice.importWL.Tips_1'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button" ng-show="vm.validInputs">{{'Siemens.SimaticIT.ProductionApp.PMProductPrice.importWL.Tips_2'|translate}}</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form" sit-layout="Vertical" sit-type="Fluid" sit-mode="edit" sit-columns="1">
        <sit-property sit-id="File" sit-widget="sit-file-uploader" sit-value="vm.file"
                      sit-validation="{ required: true }" sit-change="vm.changeFile"
                      sit-widget-attributes="{'accept':'.xls,.xlsx','sit-min-size': '1KB', 'sit-max-size': '10MB'}">
            (<a href="Siemens.SimaticIT.ProductionApp/resources/产品工价导入模板.xls">{{'Siemens.SimaticIT.ProductionApp.PMProductPrice.importWL.Tips_3'|translate}}</a>):
        </sit-property>
    </sit-property-grid>
    <div>
        <sit-tabset>
            <sit-tab heading="{{'Siemens.SimaticIT.ProductionApp.PMProductPrice.importWL.Tips_4'|translate}}">
                <div id="sittab1" style="overflow: hidden;overflow:auto;white-space: nowrap;height: 300px;"></div>
            </sit-tab>
        </sit-tabset>
    </div>
</div>
