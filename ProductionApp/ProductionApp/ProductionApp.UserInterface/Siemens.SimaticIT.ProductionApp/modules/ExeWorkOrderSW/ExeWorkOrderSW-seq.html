<style>
    .canvas .property-area-container > div.content .side-panel-property-area-body {
        overflow-y: visible;
    }
</style>
<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()"
            class="btn side-panel-button">
        {{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_1'|translate}}
    </button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form" sit-layout="Horizontal" sit-type="Fixed" sit-mode="edit" sit-columns="5">

        <sit-property sit-widget="sit-select" sit-value="vm.typeFactory.value" sit-validation="{required: false}"
                      sit-options="vm.typeFactory.options" sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'"
                      sit-read-only="false" sit-change="vm.typeFactoryChange">
            {{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.add.Tips_3'|translate}}
        </sit-property>

        <sit-property sit-widget="sit-select" sit-value="vm.typeProcess.value" sit-validation="{required: false}"
                      sit-options="vm.typeProcess.options" sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'"
                      sit-read-only="false" sit-change="vm.typeProcessChange">
            {{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_2'|translate}}
        </sit-property>
        <sit-property sit-widget="sit-select" sit-value="vm.typeMachine.value" sit-validation="{required: false}"
                      sit-options="vm.typeMachine.options" sit-to-display="'ResourceName'" sit-to-keep="'ResourceCode'"
                      sit-read-only="false">
            {{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_3'|translate}}
        </sit-property>
        <sit-command-bar sit-type="action">
            <sit-command sit-icon="fa-search" sit-type="main" sit-name="com.siemens.customcommand.search"
                         :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_4'|translate}}"
                         ng-click="vm.search"
                         :sit-label="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_4'|translate}}"></sit-command>
            <sit-command sit-icon="fa-long-arrow-up" sit-type="main" sit-name="com.siemens.customcommand.moveup"
                         :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_5'|translate}}"
                         ng-click="vm.moveUp"
                         :sit-label="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_5'|translate}}"></sit-command>
            <sit-command sit-icon="fa-long-arrow-down" sit-type="main" sit-name="com.siemens.customcommand.movedown"
                         :sit-tooltip="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_6'|translate}}"
                         ng-click="vm.moveDown"
                         :sit-label="{{'Siemens.SimaticIT.ProductionApp.ExeWorkOrderSW.seq.Tips_6'|translate}}"></sit-command>
        </sit-command-bar>
    </sit-property-grid>
</div>

<!-- grid列表 -->
<div id="listClass"
     style=" height: 74%;margin-top: 0px; padding:5px 16px 0 0px;clear: both; display: block;overflow-y: auto;">
    <div ui-grid="vm.gridSeqOptions" ui-grid-selection ui-grid-resize-columns ui-grid-auto-resize
         class="uigrid uigrid-edit gridItem" style="width:2000px;"></div>
</div>
