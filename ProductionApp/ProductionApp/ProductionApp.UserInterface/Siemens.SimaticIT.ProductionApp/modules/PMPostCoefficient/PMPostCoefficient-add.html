<style>
    .row {
        padding: 5px;
        margin-top: 10px;
    }
</style>
<div class="command-bar-side-panel">
    <button ng-click="vm.cancel()" class="btn side-panel-button">{{'Siemens.SimaticIT.ProductionApp.PMPostCoefficient.add.Tips_1'|translate}}</button>
    <button ng-click="vm.save()" class="btn side-panel-button" ng-show="vm.validInputs">{{'Siemens.SimaticIT.ProductionApp.PMPostCoefficient.add.Tips_2'|translate}}</button>
</div>
<div class="side-panel-property-area-body">
    <sit-property-grid sit-id="add_form" sit-layout="Horizontal" sit-type="Fixed" sit-mode="edit" sit-columns="1">
        <sit-property sit-widget="sit-numeric" sit-value="vm.currentItem.PeopleQty"
                      sit-validation="{required: false,min:1,pattern:'^[0-9]*$',patternInfo:'必须为整数！'}" sit-read-only="false">
            {{'Siemens.SimaticIT.ProductionApp.PMPostCoefficient.add.Tips_3'|translate}}
        </sit-property>
        <sit-property sit-widget="sit-numeric" sit-value="vm.currentItem.Coefficient"
                      sit-validation="{required: true,min:0}" sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.PMPostCoefficient.add.Tips_4'|translate}}</sit-property>
        <sit-property sit-widget="sit-text" sit-value="vm.currentItem.Remark" sit-validation="{required: false}"
                      sit-read-only="false">{{'Siemens.SimaticIT.ProductionApp.PMPostCoefficient.add.Tips_5'|translate}}</sit-property>

    </sit-property-grid>
</div>
