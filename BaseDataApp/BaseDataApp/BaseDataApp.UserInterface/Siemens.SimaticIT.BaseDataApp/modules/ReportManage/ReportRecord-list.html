<style>
    .row {
        display: -webkit-box;
        display: -webkit-flex;
        display: -ms-flexbox;
        display: flex;
        flex-wrap: wrap;
    }

        .row > [class*='col-'] {
            display: flex;
            flex-direction: column;
        }

    .ng-tree-search {
        width: 100%;
        margin-bottom: 1px;
    }

    .panel-Title {
        background-color: #fff;
        color: #333;
        height: 35px;
        line-height: 35px;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
        font-weight: bold;
        border: 1px solid #ccc;
        border-bottom-width: 0;
        padding-left: 0px;
        width: 100%;
        box-sizing: content-box;
    }

    .opeart {
        position: absolute;
        z-index: 999;
        top: 50%;
        right: -5px;
    }

        .opeart.left {
            right: 0;
            left: 0;
        }

        .opeart i {
            font-size: 25px;
            cursor: pointer;
        }
</style>

<div id="itemlistContainer" class="content-area content-area-relative" style="width:100%; height:100%;overflow: hidden">
    <!-- <div class="row">
        <button ng-click="vm.hidden()" class="btn side-panel-button">{{vm.hiddenName}}</button>
    </div> -->
    <div class="row" style="height:100%;">
        <div class="col-xs-6 col-md-6" id="boxTree" style="height: 100%;position: relative;">
            <div ng-show="vm.menuShow"
                 style="margin: 16px 0px 15px 10px; border: 1px solid #cccccc; background-color: #f6f6f6; width:calc(100%-10px); height: 100%; padding:1px 10px 0 10px;overflow: auto;">

                <js-tree tree-plugins="types,search" tree-types="typesConfig" tree-data="scope" tree-model="treeModel"
                         tree-core="treeCore" tree-events="changed:changedCB;"></js-tree>

            </div>
            <div class="opeart" ng-click="vm.hidden()">
                <i ng-show="vm.menuShow" class="fa fa-chevron-circle-left" aria-hidden="true"></i>
            </div>
            <div class="opeart left" ng-show="!vm.menuShow" ng-click="vm.hidden()">
                <i class="fa fa-chevron-circle-right .left" aria-hidden="true"></i>
            </div>
        </div>
        <div id="itemClass" class="col-xs-34 col-md-34" style="height:100%;">
            <div id="itemlist" style="width:calc(100% - 5px); height: 100% ; padding:15px 5px 0 10px">
                <div id="iframe" class="col-md-40" style="height: 100%;">
                </div>
            </div>
        </div>
    </div>
</div>
